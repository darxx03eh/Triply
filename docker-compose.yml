services:
  triply:
    container_name: triply-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
      JwtSettings__Issuer: ${ISSUER}
      JwtSettings__Audience: ${AUDIENCE}
      JwtSettings__SecretKey: ${SECRETKEY}
      JwtSettings__ValidateAudience: ${VALIDATE_AUDIENCE}
      JwtSettings__ValidateIssuer: ${VALIDATE_ISSUER}
      JwtSettings__ValidateLifetime: ${VALIDATE_LIFETIME}
      JwtSettings__ValidateIssuerSigningKey: ${VALIDATE_ISSUER_SIGNING_KEY}
      JwtSettings__ExpiryMinutes: ${EXPIRE_MINUTES}
      JwtSettings__RefreshTokenExpiryDays: ${REFRESH_TOKEN_EXPIRY_DAYS}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__HostName: ${RABBITMQ_HOSTNAME}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE}
      RabbitMq__QueueName: ${RABBITMQ_EMAIL_QUEUE}
      RabbitMq__MaxRetryCount: ${RABBITMQ_MAX_RETRY_COUNT:-3}
      RabbitMq__RetryDelayMilliseconds: ${RABBITMQ_RETRY_DELAY:-5000}
      RabbitMq__DeadLetterExchangeName: ${RABBITMQ_DEAD_LETTER_EXCHANGE}
      RabbitMq__DeadLetterQueueName: ${RABBITMQ_EMAIL_DEAD_LETTER_QUEUE}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Sieve__CaseSensitive: ${SIEVE_CASE_SENSITIVE:-false}
      Sieve__DefaultPageSize: ${SIEVE_DEFAULT_PAGE_SIZE:-10}
      Sieve__MaxPageSize: ${SIEVE_MAX_PAGE_SIZE:-50}
      ImageUpload__SharedStoragePath: ${UPLOADS_PATH}
      ImageUpload__MaxFileSizeBytes: ${UPLOADS_MAX_FILE_SIZE}
      DatabaseLoggingSettings__SlowQueryThresholdMs: ${SLOW_QUERY_THRESHOLD_MS:-500}
      Elasticsearch__Enabled: ${ELASTICSEARCH_ENABLED:-true}
      Elasticsearch__Uri: http://elasticsearch:9200
    depends_on:
      triply-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      triply-migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - uploads-temp:/app/uploads

  triply-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: triply-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - triply-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${MSSQL_USER} -P ${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: triply-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management
    container_name: triply-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  triply-migrations:
    build:
      context: .
      dockerfile: src/Dockerfile.Migrations
    container_name: triply-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
      JwtSettings__Issuer: ${ISSUER}
      JwtSettings__Audience: ${AUDIENCE}
      JwtSettings__SecretKey: ${SECRETKEY}
      JwtSettings__ValidateAudience: ${VALIDATE_AUDIENCE}
      JwtSettings__ValidateIssuer: ${VALIDATE_ISSUER}
      JwtSettings__ValidateLifetime: ${VALIDATE_LIFETIME}
      JwtSettings__ValidateIssuerSigningKey: ${VALIDATE_ISSUER_SIGNING_KEY}
      JwtSettings__ExpiryMinutes: ${EXPIRE_MINUTES}
      JwtSettings__RefreshTokenExpiryDays: ${REFRESH_TOKEN_EXPIRY_DAYS}
    depends_on:
      triply-db:
        condition: service_healthy

  email-worker:
    build:
      context: .
      dockerfile: workers/EmailWorker/Dockerfile
    container_name: email-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__HostName: ${RABBITMQ_HOSTNAME}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE}
      RabbitMq__QueueName: ${RABBITMQ_EMAIL_QUEUE}
      RabbitMq__MaxRetryCount: ${RABBITMQ_MAX_RETRY_COUNT}
      RabbitMq__RetryDelayMilliseconds: ${RABBITMQ_RETRY_DELAY}
      RabbitMq__DeadLetterExchangeName: ${RABBITMQ_DEAD_LETTER_EXCHANGE}
      RabbitMq__DeadLetterQueueName: ${RABBITMQ_EMAIL_DEAD_LETTER_QUEUE}
      RabbitMq__DeadLetterRoutingKey: email.send
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__UserName: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__UseSsl: ${SMTP_USE_SSL}
      Elasticsearch__Enabled: ${ELASTICSEARCH_ENABLED:-true}
      Elasticsearch__Uri: http://elasticsearch:9200

  image-worker:
    build:
      context: .
      dockerfile: workers/ImageUploader/Dockerfile
    container_name: image-uploader
    restart: unless-stopped
    volumes:
      - uploads-temp:/app/uploads
    environment:
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
      RabbitMq__HostName: ${RABBITMQ_HOSTNAME}
      RabbitMq__Port: ${RABBITMQ_PORT}
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE}
      RabbitMq__QueueName: ${RABBITMQ_IMAGE_QUEUE}
      RabbitMq__MaxRetryCount: ${RABBITMQ_MAX_RETRY_COUNT}
      RabbitMq__RetryDelayMilliseconds: ${RABBITMQ_RETRY_DELAY}
      RabbitMq__DeadLetterExchangeName: ${RABBITMQ_DEAD_LETTER_EXCHANGE}
      RabbitMq__DeadLetterQueueName: ${RABBITMQ_IMAGE_DEAD_LETTER_QUEUE}
      RabbitMq__DeadLetterRoutingKey: image.upload
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      Elasticsearch__Enabled: ${ELASTICSEARCH_ENABLED:-true}
      Elasticsearch__Uri: http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      triply-db:
        condition: service_healthy
      triply-migrations:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: triply-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: triply-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # One-shot: creates the "Triply logs" data view (logs-triply.*) in Kibana, then exits.
  kibana-setup:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: triply-kibana-setup
    restart: "no"
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        curl -fsS -X POST http://kibana:5601/api/data_views/data_view
        -H 'kbn-xsrf: true' -H 'Content-Type: application/json'
        -d '{"override": true, "data_view": {"id": "triply-logs", "title": "logs-triply.*", "name": "Triply logs", "timeFieldName": "@timestamp"}}'
        && echo ' -> Triply logs data view is ready'
        
  #frontend:
    #build:
      #context: ./frontend
      #dockerfile: Dockerfile
    #container_name: triply-frontend
    #restart: unless-stopped
    #ports:
      #- "3000:80"
    #depends_on:
      #triply:
        #condition: service_healthy

volumes:
  triply-data:
  rabbitmq-data:
  redis-data:
  uploads-temp:
  elasticsearch-data: