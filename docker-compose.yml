services:
  triply:
    container_name: triply-api
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s