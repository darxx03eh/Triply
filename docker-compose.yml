services:
  triply:
    container_name: triply-api
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
    depends_on:
      triply-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  triply-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: triply-db
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - triply-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${MSSQL_USER} -P ${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  triply-migrations:
    build:
      context: ./src
      dockerfile: Dockerfile.Migrations
    container_name: triply-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
    depends_on:
      triply-db:
        condition: service_healthy
volumes:
  triply-data: