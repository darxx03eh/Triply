services:
  triply:
    container_name: triply-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
      JwtSettings__Issuer: ${ISSUER}
      JwtSettings__Audience: ${AUDIENCE}
      JwtSettings__SecretKey: ${SECRETKEY}
      JwtSettings__ValidateAudience: ${VALIDATE_AUDIENCE}
      JwtSettings__ValidateIssuer: ${VALIDATE_ISSUER}
      JwtSettings__ValidateLifetime: ${VALIDATE_LIFETIME}
      JwtSettings__ValidateIssuerSigningKey: ${VALIDATE_ISSUER_SIGNING_KEY}
      JwtSettings__ExpiryMinutes: ${EXPIRE_MINUTES}
      JwtSettings__RefreshTokenExpiryDays: ${REFRESH_TOKEN_EXPIRY_DAYS}
    depends_on:
      triply-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  triply-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: triply-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - triply-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${MSSQL_USER} -P ${MSSQL_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:management
    container_name: triply-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  triply-migrations:
    build:
      context: .
      dockerfile: src/Dockerfile.Migrations
    container_name: triply-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TriplyDbLocalConnection: ${TRIPLY_DB_CONNECTION}
    depends_on:
      triply-db:
        condition: service_healthy
volumes:
  triply-data:
  rabbitmq-data: