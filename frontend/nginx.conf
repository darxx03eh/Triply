server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the API container through Docker's DNS on each request, so nginx starts even if the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://triply:8080;

    # Keep existing e-mail links that targeted the API route working. New links go directly to
    # /confirm-email, which the SPA handles before making its JSON request to this API route.
    location = /api/v1/auth/confirm-email {
        if ($http_accept ~* "text/html") {
            rewrite ^ /confirm-email last;
        }
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        proxy_pass $api;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /health {
        proxy_pass $api;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
