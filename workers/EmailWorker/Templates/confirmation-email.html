<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Confirm your Triply account</title>
	<style>
		@media screen and (max-width: 600px) {
			.email-shell { width: 100% !important; }
			.content { padding: 36px 24px !important; }
			.footer { padding: 24px !important; }
		}
	</style>
</head>
<body style="margin:0; padding:0; background-color:#eef3f1; color:#18342f; font-family:Arial, Helvetica, sans-serif;">
	<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#eef3f1;">
		<tr>
			<td align="center" style="padding:32px 16px;">
				<table role="presentation" class="email-shell" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden;">
					<tr>
						<td style="padding:26px 40px; background-color:#18342f;">
							<span style="color:#b8e6d5; font-size:22px; font-weight:700; letter-spacing:1px;">TRIPLY</span>
						</td>
					</tr>
					<tr>
						<td class="content" style="padding:48px 56px 44px;">
							<div style="width:48px; height:48px; line-height:48px; border-radius:50%; background-color:#dff5ec; color:#16805f; text-align:center; font-size:24px;">&#10003;</div>
							<h1 style="margin:24px 0 12px; color:#18342f; font-size:32px; line-height:1.2; font-weight:700;">Welcome, {{ user_name }}!</h1>
							<p style="margin:0 0 28px; color:#5b706b; font-size:16px; line-height:1.7;">Your next great stay starts here. Confirm your email address to finish setting up your Triply account.</p>
							<table role="presentation" cellspacing="0" cellpadding="0" border="0">
								<tr>
									<td style="border-radius:8px; background-color:#e07a4f;">
										<a href="{{ confirmation_link }}" style="display:inline-block; padding:15px 24px; color:#ffffff; font-size:15px; font-weight:700; text-decoration:none;">Confirm my account</a>
									</td>
								</tr>
							</table>
							<p style="margin:28px 0 0; color:#7b8d88; font-size:13px; line-height:1.6;">If you did not create a Triply account, you can safely ignore this email.</p>
						</td>
					</tr>
					<tr>
						<td class="footer" style="padding:24px 56px; background-color:#f7faf9; color:#7b8d88; font-size:12px; line-height:1.6;">Triply &middot; Your journey, thoughtfully planned.</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
