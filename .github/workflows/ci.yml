name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request: 
    branches: ["main", "develop"]

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal --filter "Category!=ApiTests"

  email-worker:
    name: Build Email Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workers/EmailWorker/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  image-worker:
    name: Build Image Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workers/ImageUploader/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  expire-bookings-worker:
    name: Build Expire Pending Bookings Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workers/ExpirePendingBookings/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  message-queue-library:
    name: Build Message Queue Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./libraries/MessageQueue/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  logging-library:
    name: Build Logging Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./libraries/Logging/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x
            
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --no-restore
        
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

  frontend:
      name: Build Frontend
      runs-on: ubuntu-latest
      defaults:
          run:
              working-directory: ./frontend
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: ./frontend/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Build frontend
          run: npm run build

  docker-compose:
    name: Build Docker Compose images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.0.x


      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Create .env
        run: |
          cat > .env <<EOF
          ASPNETCORE_ENVIRONMENT=Testing

          TRIPLY_DB_CONNECTION=${{ secrets.TRIPLY_DB_CONNECTION }}

          ISSUER=${{ secrets.ISSUER }}
          AUDIENCE=${{ secrets.AUDIENCE }}
          SECRETKEY=${{ secrets.SECRETKEY }}
          VALIDATE_AUDIENCE=true
          VALIDATE_ISSUER=true
          VALIDATE_LIFETIME=true
          VALIDATE_ISSUER_SIGNING_KEY=true
          EXPIRE_MINUTES=60
          REFRESH_TOKEN_EXPIRY_DAYS=7

          ACCEPT_EULA=Y
          MSSQL_USER=sa
          MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}

          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_HOSTNAME=rabbitmq
          RABBITMQ_PORT=5672
          RABBITMQ_EXCHANGE=triply
          RABBITMQ_EMAIL_QUEUE=email
          RABBITMQ_IMAGE_QUEUE=image
          RABBITMQ_MAX_RETRY_COUNT=3
          RABBITMQ_RETRY_DELAY=5000
          RABBITMQ_DEAD_LETTER_EXCHANGE=triply.dlx
          RABBITMQ_EMAIL_DEAD_LETTER_QUEUE=email.dlq

          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          SIEVE_CASE_SENSITIVE=false
          SIEVE_DEFAULT_PAGE_SIZE=10
          SIEVE_MAX_PAGE_SIZE=50

          UPLOADS_PATH=/app/uploads
          UPLOADS_MAX_FILE_SIZE=10485760

          SLOW_QUERY_THRESHOLD_MS=500

          ELASTICSEARCH_ENABLED=true

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PROVIDER_ID=stripe
          CURRENCY=usd
          SUCCESS_URL=http://localhost:8080/payment/success
          CANCEL_URL=http://localhost:8080/payment/cancel

          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS=${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_FROM_NAME=Triply
          SMTP_USE_SSL=true

          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

          BOOKING_PENDING_EXPIRY_MINUTES=45
          BOOKING_EXPIRY_CHECK_INTERVAL_MINUTES=5
          EOF

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose images
        run: docker compose build

      - name: Run Docker Compose
        run: docker compose up -d

      - name: Check containers
        run: docker compose ps

      - name: Wait for API to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Run API tests
        working-directory: ./src
        run: dotnet test --verbosity normal --filter "Category=ApiTests"
        env:
          API_BASE_URL: http://localhost:8080